[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-model-updating"
version = "0.1.0"
description = "Research reference implementation of digital-twin model updating for industrial equipment monitoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.1",
  "PyWavelets>=1.4,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
filterwarnings = ["ignore:Could not find the number of physical cores.*:UserWarning"]
